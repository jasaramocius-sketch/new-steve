<VirtualHost *:80>
    ServerName new-steve.local
    Redirect permanent / https://new-steve.local/

    ErrorLog ${APACHE_LOG_DIR}/new-steve-error.log
    CustomLog ${APACHE_LOG_DIR}/new-steve-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName new-steve.local
    DocumentRoot /var/www/html/new-steve/public

    SSLEngine on
    SSLCertificateFile /var/www/html/new-steve/storage/certs/new-steve.local.crt
    SSLCertificateKeyFile /var/www/html/new-steve/storage/certs/new-steve.local.key

    <Directory /var/www/html/new-steve/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/new-steve-error.log
    CustomLog ${APACHE_LOG_DIR}/new-steve-access.log combined
</VirtualHost>
